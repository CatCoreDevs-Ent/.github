# Uygulama CI'ı (CatCoreDevs-Ent şablonu). Yalnızca ÖZEL repolar için: işler org'un self-hosted runner'larında
# (catcore-arc) çalışır, herkese açık repodan reddedilir.
#
# main'e push: test → imaj → Zot'ta etiketsiz push → Trivy → cosign imza + SBOM → etiket sha-<12>.
# Ardından Score render'ı: score.yaml → staging ve production manifestleri (imajlar bu commit'in digest'leri) →
# cr.catcore.dev/<uygulama>/rendered:sha-<12> (imzalı). Kargo yalnızca sha-* etiketlerini görür, manifestleri deploy
# reposuna yazar ve staging'e kendisi terfi ettirir. PR: sadece test + build + örnek imajlarla render (yayım yok).
#
# Doldurulacaklar:
#   image        UYGULAMA yerine uygulamanın adı: <uygulama>/<bileşen> (ör. hello/web); registry'de cr.catcore.dev/<uygulama>/<bileşen> olur.
#   test-target  Dockerfile'daki test aşaması (BuildKit'te çalışır, runner'da araç kurmak gerekmez) ya da
#   test-command runner'da çalışan komut (Docker yok; Docker/services isteyen testler GitHub-hosted'da ayrı iş).
#   Çok bileşenli repo: aşağıdaki matrix'e bileşen ekle (her biri kendi Dockerfile'ı ve context'iyle).
#   render       app: UYGULAMA; score-files: iş yükü başına bir Score dosyası, metadata.name <uygulama>-<bileşen>
#                (bileşen matrix'tekiyle aynı), `image: .`. Ortam farkları <dosya>.staging.yaml / .production.yaml'da.
#                Score'a geçmemiş (deploy reposunda chart'lı) uygulama render işini siler.
#
# build-image.yml'i ve score-render.yml'i commit SHA'sıyla sabitle (Renovate günceller); etiket yorumda.
name: ci

on:
  push:
    branches: [$default-branch]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # PR'da eski çalıştırma iptal edilir; main'de her commit'in imajı tamamlanır.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: web
            context: .
            dockerfile: Dockerfile
    uses: CatCoreDevs-Ent/.github/.github/workflows/build-image.yml@c457afd1367b3b5da12a8b521f67373b63195fba # v1.0.0
    with:
      image: UYGULAMA/${{ matrix.component }}
      context: ${{ matrix.context }}
      dockerfile: ${{ matrix.dockerfile }}
      test-target: test
      build-args: |
        VERSION=${{ github.sha }}

  # İmajlardan sonra: render aynı commit'in imaj etiketlerini (sha-<12>) digest'e çevirir.
  render:
    needs: image
    uses: CatCoreDevs-Ent/.github/.github/workflows/score-render.yml@d82d89b4ef2ec41e0e1f265fc40a2035ae583462 # v1.1.0
    with:
      app: UYGULAMA
      score-files: |
        score.yaml
