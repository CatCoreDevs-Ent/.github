# Uygulama CI'ı (CatCoreDevs-Ent şablonu). Yalnızca ÖZEL repolar için: işler org'un self-hosted runner'larında
# (catcore-arc) çalışır, herkese açık repodan reddedilir.
#
# main'e push: test → imaj → Zot'ta etiketsiz push → Trivy → cosign imza + SBOM → etiket sha-<12>. Kargo yalnızca
# sha-* etiketlerini görür, digest'leri deploy reposuna (apps/<uygulama>/<ortam>, ortak Helm chart'ın değerleri) yazar
# ve staging'e kendisi terfi ettirir. Bağımlılıklar (Postgres, Valkey, Kafka, S3…) deploy reposundaki değerlerde:
# infra docs/yeni-uygulama.md. PR: sadece test + build (yayım yok).
#
# Doldurulacaklar:
#   image        UYGULAMA yerine uygulamanın adı: <uygulama>/<bileşen> (ör. hello/web); registry'de cr.catcore.dev/<uygulama>/<bileşen> olur.
#   test-target  Dockerfile'daki test aşaması (BuildKit'te çalışır, runner'da araç kurmak gerekmez) ya da
#   test-command runner'da çalışan komut (Docker yok; Docker/services isteyen testler GitHub-hosted'da ayrı iş).
#   Çok bileşenli repo: aşağıdaki matrix'e bileşen ekle (her biri kendi Dockerfile'ı ve context'iyle; bileşen adı
#                infra kaydındaki components ve deploy değerlerindeki app.components.<bileşen> ile aynı).
#   Özel bağımlılıklar (isteğe bağlı, secret gerekmez; Dockerfile örnekleri .github README → "Özel bağımlılıklar"):
#     private-go-repos: catcore-sdk   özel Go modülü (BuildKit secret id=github_token, yalnızca okuma)
#     npm-github-packages: true       GitHub Packages npm (id=npm_token); işe packages: read iznini de ver
#
# build-image.yml'i commit SHA'sıyla sabitle (Renovate günceller); etiket yorumda.
name: ci

on:
  push:
    branches: [$default-branch]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # PR'da eski çalıştırma iptal edilir; main'de her commit'in imajı tamamlanır.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: web
            context: .
            dockerfile: Dockerfile
    # npm-github-packages kullanılıyorsa:
    # permissions:
    #   contents: read
    #   packages: read
    uses: CatCoreDevs-Ent/.github/.github/workflows/build-image.yml@0ac2e14e29e2a987e2a282f0b891b887aba9ff2d # v1.3.0
    with:
      image: UYGULAMA/${{ matrix.component }}
      context: ${{ matrix.context }}
      dockerfile: ${{ matrix.dockerfile }}
      test-target: test
      build-args: |
        VERSION=${{ github.sha }}
      # private-go-repos: catcore-sdk
      # npm-github-packages: true
